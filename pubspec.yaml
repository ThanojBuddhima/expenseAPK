name: expence_apk
description: Expensely - Smart Offline Expense Manager
publish_to: 'none'
version: 0.0.1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.0.0+4
  path_provider: ^2.0.0
  path: ^1.8.0
  provider: ^6.0.0
  fl_chart: ^0.69.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.0
  package_info_plus: ^8.3.0
  http: ^1.4.0
  open_filex: ^4.7.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.2.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#FF9800'
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: '#FF9800'
    theme_color: '#FF9800'
  windows:
    generate: true
    image_path: assets/images/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/app_icon.png

flutter_native_splash:
  color: '#FF9800'
  image: assets/images/app_icon.png
  android_12:
    color: '#FF9800'
    image: assets/images/app_icon.png
  web: true
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
